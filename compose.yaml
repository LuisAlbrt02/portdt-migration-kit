services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5001
      FRONTEND_URL: ${CORS_FRONTEND_URL:-https://funchalportds.feelab.info}
    ports:
      - "${BACKEND_PORT:-5002}:5001"
    networks:
      shared-proxy:
        aliases:
          - portdt-backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://funchalportds.feelab.info}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    networks:
      shared-proxy:
        aliases:
          - portdt-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  shared-proxy:
    external: true
    name: shared-proxy
